<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="syrupL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c777" stop-opacity=".55"/><stop offset="1" stop-color="#e98f1f" stop-opacity=".75"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
  <text x="40" y="44" font-size="22" font-weight="800" fill="#151515">단면 · 통 바닥과 받침 가운데 (라이트 A · 1L · 축척 아님)</text>
  <text x="40" y="68" font-size="13" fill="#666">통에 구멍 · 실링 없음 · 열 부품(컵 · 히터 · 펠티어 · 팬) 없음. 젓개는 뚜껑 가운데 투명 축 끝에 딸깍 끼워 바닥에서 돌고, 뚜껑을 들면 같이 나옵니다(오목 자리 · 세라믹 볼 없음).</text>

  <!-- base shell Ø125 × 45 -->
  <path d="M375 452 Q375 430 397 430 L803 430 Q825 430 825 452 L825 582 Q825 600 807 600 L393 600 Q375 600 375 582 Z" fill="#f4f2ee" stroke="#c9c4bb" stroke-width="2"/>
  <!-- jar seat (6mm recess) -->
  <path d="M405 430 L405 452 L795 452 L795 430" fill="#ece9e3" stroke="#c9c4bb" stroke-width="1.5"/>
  <!-- bottom plate + feet -->
  <rect x="387" y="598" width="426" height="12" fill="#e6e2da" stroke="#c9c4bb"/>
  <rect x="405" y="610" width="34" height="8" rx="3" fill="#444"/><rect x="761" y="610" width="34" height="8" rx="3" fill="#444"/>
  <!-- light rim (diffuser) at seat edge -->
  <rect x="397" y="426" width="10" height="8" fill="#fff3cf" stroke="#d9a53c"/><rect x="793" y="426" width="10" height="8" fill="#fff3cf" stroke="#d9a53c"/>
  <!-- single-colour LED ring on seat floor -->
  <g fill="#ffd27a" stroke="#d9a53c"><rect x="425" y="447" width="12" height="5"/><rect x="763" y="447" width="12" height="5"/></g>

  <!-- glass jar (outer Ø106, wall 3mm, floor 2.5mm) -->
  <path d="M414 290 L414 440 Q414 448 422 448 L778 448 Q786 448 786 440 L786 290" fill="none" stroke="#5aa5c8" stroke-width="10" stroke-linejoin="round"/>
  <!-- 1.0L line -->
  <line x1="419" y1="318" x2="781" y2="318" stroke="#8aa0ac" stroke-width="1.5" stroke-dasharray="4 4"/><text x="798" y="322" font-size="11" fill="#6c7d88">1.0L 상한 선</text>
  <!-- syrup -->
  <rect x="419" y="330" width="362" height="112" fill="url(#syrupL)"/>

  <!-- stirrer: silicone body Ø54 -->
  <path d="M503 442 L503 402 Q503 390 515 390 L685 390 Q697 390 697 402 L697 442 Z" fill="#f2f2f2" fill-opacity=".92" stroke="#8c8c8c" stroke-width="2"/>
  <!-- clear stem from lid (above frame) down into the stirrer socket + snap collar -->
  <rect x="594" y="290" width="12" height="100" fill="#e4f3f9" stroke="#5aa5c8" stroke-width="1.5"/>
  <rect x="584" y="374" width="32" height="16" rx="3" fill="#dcdcdc" stroke="#777" stroke-width="1.5"/>
  <!-- PP capsule with Ø40 disc magnet (4-pole; two poles visible in section) -->
  <rect x="524" y="418" width="152" height="20" fill="#dcdcdc" stroke="#777"/>
  <g stroke="#333" stroke-width="1"><rect x="530" y="421" width="64" height="14" fill="#d33"/><rect x="606" y="421" width="64" height="14" fill="#2a6bd6"/></g>
  <!-- blades (two visible) -->
  <path d="M515 390 L478 378 L515 400 Z" fill="#e3e3e3" stroke="#8c8c8c"/><path d="M685 390 L722 378 L685 400 Z" fill="#e3e3e3" stroke="#8c8c8c"/>

  <!-- drive disc Ø40 × 5 + back yoke + bush + motor -->
  <rect x="528" y="468" width="144" height="18" fill="#ececec" stroke="#777"/>
  <g stroke="#333"><rect x="534" y="471" width="60" height="12" fill="#2a6bd6"/><rect x="606" y="471" width="60" height="12" fill="#d33"/></g>
  <rect x="528" y="486" width="144" height="4" fill="#555"/>
  <rect x="582" y="490" width="36" height="8" fill="#b87333" stroke="#8a5a2a"/>
  <rect x="556" y="498" width="88" height="62" rx="6" fill="#bdbdbd" stroke="#777"/>
  <text x="600" y="533" font-size="12" text-anchor="middle" fill="#222">5V 기어 모터 Ø24</text>
  <!-- gap dimension (glass outer bottom 452 → disc top 468 = 4.5mm) -->
  <g stroke="#c41f3e" stroke-width="1.5"><line x1="700" y1="452" x2="700" y2="468"/><line x1="692" y1="452" x2="708" y2="452"/><line x1="692" y1="468" x2="708" y2="468"/></g>
  <text x="712" y="464" font-size="12" fill="#c41f3e" font-weight="700">4.5mm</text>

  <!-- hall sensor (jar detect) under seat edge right -->
  <rect x="748" y="456" width="26" height="8" fill="#9fd39f" stroke="#777"/><rect x="754" y="452" width="14" height="4" fill="#555"/>
  <!-- board + USB-C port on rear wall (drawn at right) -->
  <rect x="660" y="572" width="140" height="6" fill="#2e7d32"/><text x="730" y="592" font-size="11" text-anchor="middle" fill="#333">제어 보드 · 모터 드라이버 · 전류 감지</text>
  <rect x="818" y="500" width="14" height="22" rx="4" fill="#3a3c40"/><text x="840" y="515" font-size="11" fill="#333">USB-C 꽂이(뒤)</text>
  <path d="M800 575 L810 575 L810 511 L818 511" fill="none" stroke="#555" stroke-width="1.5"/>

  <!-- leader labels left -->
  <g font-size="13" fill="#222">
    <g stroke="#999" stroke-width="1"><line x1="414" y1="300" x2="120" y2="150"/><line x1="503" y1="405" x2="120" y2="215"/><line x1="540" y1="428" x2="120" y2="270"/><line x1="478" y1="378" x2="120" y2="330"/><line x1="395" y1="500" x2="120" y2="420"/><line x1="405" y1="604" x2="120" y2="520"/><line x1="403" y1="430" x2="120" y2="590"/></g>
    <text x="40" y="146"><tspan font-weight="800">1</tspan> 유리 통 · 붕규산 3.3 · 1L(전체 1.2L) · 바닥 2.5mm 평평<tspan x="56" dy="16">입구 Ø100이 가장 넓음 → 프레스 성형 · 서냉 · 오목 자리 없음</tspan></text>
    <text x="40" y="211"><tspan font-weight="800">2</tspan> 젓개 몸 · 식품용 실리콘 · Ø5.4cm · 축 끝에 딸깍 · 빼서 식기세척기</text>
    <text x="40" y="266"><tspan font-weight="800">3</tspan> 자석 디스크 Ø40 × 5mm(4극 · N38SH급) · 도금 · PP 봉입 · 실리콘 덮기</text>
    <text x="40" y="326"><tspan font-weight="800">4</tspan> 날개 3장 · 각도 15° (아래 → 위 흐름)</text>
    <text x="40" y="416"><tspan font-weight="800">5</tspan> 받침 · 흰 무광 · Ø125 × 45mm<tspan x="56" dy="16">통 자리 6mm · 컵 · 히터 · 펠티어 · 팬 없음</tspan></text>
    <text x="40" y="516"><tspan font-weight="800">6</tspan> 바닥판 · 고무발 4 · 바람 구멍 없음</text>
    <text x="40" y="586"><tspan font-weight="800">7</tspan> 빛 테 · 유백 PC 확산 · 단색(따뜻한 흰)</text>
  </g>
  <!-- leader labels right -->
  <g font-size="13" fill="#222">
    <g stroke="#999" stroke-width="1"><line x1="606" y1="300" x2="1080" y2="150"/><line x1="672" y1="477" x2="1080" y2="230"/><line x1="618" y1="494" x2="1080" y2="290"/><line x1="644" y1="520" x2="1080" y2="350"/><line x1="761" y1="460" x2="1080" y2="410"/><line x1="769" y1="449" x2="1080" y2="470"/><line x1="832" y1="511" x2="1080" y2="530"/><line x1="800" y1="575" x2="1080" y2="590"/></g>
    <text x="1160" y="146" text-anchor="end"><tspan font-weight="800">8</tspan> 투명 축 · 트라이탄 Ø8 · 뚜껑 가운데 베어링에서 따라 돎<tspan x="1160" dy="16">뚜껑을 들면 젓개가 같이 나옴 · 축이 젓개를 가운데에 잡아 줌</tspan></text>
    <text x="1160" y="226" text-anchor="end"><tspan font-weight="800">9</tspan> 구동 자석 디스크 Ø40 × 5mm + 철 백요크 1mm</text>
    <text x="1160" y="286" text-anchor="end"><tspan font-weight="800">10</tspan> 부시 베어링 · 자석 당김 약 8N을 받음</text>
    <text x="1160" y="346" text-anchor="end"><tspan font-weight="800">11</tspan> 5V 기어 모터 · 20~30rpm · 0.1 N·m · 평균 1~2W</text>
    <text x="1160" y="406" text-anchor="end"><tspan font-weight="800">12</tspan> 통 감지 · 홀 센서 (구동 자석과 25mm 이상)</text>
    <text x="1160" y="466" text-anchor="end"><tspan font-weight="800">13</tspan> 단색 LED 링 (숨쉬기 = 젓는 중 · 고정 = 다 녹음)</text>
    <text x="1160" y="526" text-anchor="end"><tspan font-weight="800">14</tspan> USB-C 꽂이 · CC 5.1kΩ 두 개로 5V 고정 · PD 없음</text>
    <text x="1160" y="586" text-anchor="end"><tspan font-weight="800">15</tspan> 제어 보드 · MCU + 모터 드라이버 + 전류 감지<tspan x="1160" dy="16">걸림 · 헛돎 · 다 녹음 판정 · 온도 제어 없음</tspan></text>
  </g>
  <text x="600" y="690" font-size="12" text-anchor="middle" fill="#777">빨강 치수 = 유효 간격 4.5mm(유리 2.5 + 젓개 덮개 1.0 + 띄움 0.5 + 틈 0.5) · 빨강·파랑 = 자석 디스크 N·S극(4극 중 단면에 보이는 2개) · 치수는 설계 목표값 · 2L 이전 안 단면도는 아래 접힌 칸</text>
</svg>
