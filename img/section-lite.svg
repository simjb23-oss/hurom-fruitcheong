<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="syrupL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c777" stop-opacity=".55"/><stop offset="1" stop-color="#e98f1f" stop-opacity=".75"/></linearGradient>
    <clipPath id="jarIn"><path d="M372 290 Q380 340 410 400 Q430 436 456 448 L744 448 Q770 436 790 400 Q820 340 828 290 Z"/></clipPath>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
  <text x="40" y="44" font-size="22" font-weight="800" fill="#151515">단면 · 통 바닥과 받침 가운데 (라이트 · 항아리형 1L · 축척 아님)</text>
  <text x="40" y="68" font-size="13" fill="#666">기준 디자인(첫 화면 사진) — 배 Ø130 · 입구 Ø110 · 높이 120 · 받침 Ø150 × 40. 통에 구멍 · 실링 없음 · 열 부품 없음. 젓개는 뚜껑 손잡이(= 축 머리)에서 내려온 투명 축 끝에 딸깍 끼워 바닥에서 돕니다.</text>

  <!-- base shell Ø150 × 40 (3.6px/mm) -->
  <path d="M330 452 Q330 430 352 430 L848 430 Q870 430 870 452 L870 582 Q870 600 852 600 L348 600 Q330 600 330 582 Z" fill="#f4f2ee" stroke="#c9c4bb" stroke-width="2"/>
  <!-- jar seat (6mm recess · Ø94) -->
  <path d="M430 430 L430 452 L770 452 L770 430" fill="#ece9e3" stroke="#c9c4bb" stroke-width="1.5"/>
  <!-- bottom plate + feet -->
  <rect x="342" y="598" width="516" height="12" fill="#e6e2da" stroke="#c9c4bb"/>
  <rect x="360" y="610" width="34" height="8" rx="3" fill="#444"/><rect x="806" y="610" width="34" height="8" rx="3" fill="#444"/>
  <!-- light ring on the base top rim (diffuser, both sides of the seat) -->
  <rect x="410" y="426" width="22" height="8" rx="2" fill="#fff3cf" stroke="#d9a53c"/><rect x="768" y="426" width="22" height="8" rx="2" fill="#fff3cf" stroke="#d9a53c"/>
  <!-- single-colour LED on seat floor -->
  <g fill="#ffd27a" stroke="#d9a53c"><rect x="448" y="447" width="12" height="5"/><rect x="740" y="447" width="12" height="5"/></g>

  <!-- glass jar: belly Ø130 above the frame, foot Ø80 flat, wall 3mm, floor 2.5mm -->
  <path d="M372 290 Q380 340 410 400 Q430 436 456 448 L744 448 Q770 436 790 400 Q820 340 828 290" fill="none" stroke="#5aa5c8" stroke-width="10" stroke-linejoin="round"/>
  <!-- belly dimension hint -->
  <g stroke="#8aa0ac" stroke-width="1" stroke-dasharray="3 3"><line x1="366" y1="300" x2="366" y2="372"/><line x1="834" y1="300" x2="834" y2="372"/></g>
  <text x="600" y="280" font-size="11" text-anchor="middle" fill="#6c7d88">↑ 위로 배 Ø130(바닥에서 약 50mm) → 어깨 → 입구 Ø110 · 1.0L 상한 선은 어깨 아래</text>
  <!-- syrup (clipped to jar) -->
  <rect x="366" y="312" width="468" height="134" fill="url(#syrupL)" clip-path="url(#jarIn)"/>

  <!-- stirrer: silicone body Ø54 -->
  <path d="M503 442 L503 402 Q503 390 515 390 L685 390 Q697 390 697 402 L697 442 Z" fill="#f2f2f2" fill-opacity=".92" stroke="#8c8c8c" stroke-width="2"/>
  <!-- clear stem from lid (above frame) down into the stirrer socket + snap collar -->
  <rect x="594" y="290" width="12" height="100" fill="#e4f3f9" stroke="#5aa5c8" stroke-width="1.5"/>
  <rect x="584" y="374" width="32" height="16" rx="3" fill="#dcdcdc" stroke="#777" stroke-width="1.5"/>
  <!-- PP capsule with Ø40 disc magnet (4-pole; two poles visible in section) -->
  <rect x="524" y="418" width="152" height="20" fill="#dcdcdc" stroke="#777"/>
  <g stroke="#333" stroke-width="1"><rect x="530" y="421" width="64" height="14" fill="#d33"/><rect x="606" y="421" width="64" height="14" fill="#2a6bd6"/></g>
  <!-- blades (two visible) -->
  <path d="M515 390 L478 378 L515 400 Z" fill="#e3e3e3" stroke="#8c8c8c"/><path d="M685 390 L722 378 L685 400 Z" fill="#e3e3e3" stroke="#8c8c8c"/>

  <!-- drive disc Ø40 × 5 + back yoke + bush + motor -->
  <rect x="528" y="468" width="144" height="18" fill="#ececec" stroke="#777"/>
  <g stroke="#333"><rect x="534" y="471" width="60" height="12" fill="#2a6bd6"/><rect x="606" y="471" width="60" height="12" fill="#d33"/></g>
  <rect x="528" y="486" width="144" height="4" fill="#555"/>
  <rect x="582" y="490" width="36" height="8" fill="#b87333" stroke="#8a5a2a"/>
  <rect x="556" y="498" width="88" height="62" rx="6" fill="#bdbdbd" stroke="#777"/>
  <text x="600" y="533" font-size="12" text-anchor="middle" fill="#222">5V 기어 모터 Ø24</text>
  <!-- gap dimension (glass outer bottom 452 → disc top 468 = 4.5mm) -->
  <g stroke="#c41f3e" stroke-width="1.5"><line x1="700" y1="452" x2="700" y2="468"/><line x1="692" y1="452" x2="708" y2="452"/><line x1="692" y1="468" x2="708" y2="468"/></g>
  <text x="712" y="464" font-size="12" fill="#c41f3e" font-weight="700">4.5mm</text>

  <!-- hall sensor (jar detect) under seat edge right -->
  <rect x="738" y="456" width="26" height="8" fill="#9fd39f" stroke="#777"/><rect x="744" y="452" width="14" height="4" fill="#555"/>
  <!-- board + USB-C port on rear wall (drawn at right) -->
  <rect x="690" y="572" width="150" height="6" fill="#2e7d32"/><text x="765" y="592" font-size="11" text-anchor="middle" fill="#333">제어 보드 · 모터 드라이버 · 전류 감지</text>
  <rect x="863" y="500" width="14" height="22" rx="4" fill="#3a3c40"/>
  <path d="M840 575 L852 575 L852 511 L863 511" fill="none" stroke="#555" stroke-width="1.5"/>
  <!-- front face: light bar + button (drawn at left wall) -->
  <rect x="323" y="455" width="7" height="20" rx="2" fill="#ffd27a" stroke="#d9a53c"/><rect x="323" y="500" width="7" height="30" rx="3" fill="#fff" stroke="#999"/>

  <!-- leader labels left -->
  <g font-size="13" fill="#222">
    <g stroke="#999" stroke-width="1"><line x1="392" y1="370" x2="120" y2="150"/><line x1="503" y1="405" x2="120" y2="215"/><line x1="540" y1="428" x2="120" y2="270"/><line x1="478" y1="378" x2="120" y2="330"/><line x1="350" y1="500" x2="120" y2="420"/><line x1="360" y1="604" x2="120" y2="520"/><line x1="421" y1="430" x2="120" y2="590"/><line x1="326" y1="465" x2="120" y2="650"/></g>
    <text x="40" y="146"><tspan font-weight="800">1</tspan> 유리 통 · 붕규산 3.3 · 1L(전체 1.3L) · 바닥 Ø80 평평 2.5mm<tspan x="56" dy="16">배 Ø130 · 입구 Ø110 · 높이 120 → 취입(블로우) 성형 · 서냉 · 오목 자리 없음</tspan></text>
    <text x="40" y="211"><tspan font-weight="800">2</tspan> 젓개 몸 · 식품용 실리콘 · Ø5.4cm · 축 끝에 딸깍 · 빼서 식기세척기</text>
    <text x="40" y="266"><tspan font-weight="800">3</tspan> 자석 디스크 Ø40 × 5mm(4극 · N38SH급) · 도금 · PP 봉입 · 실리콘 덮기</text>
    <text x="40" y="326"><tspan font-weight="800">4</tspan> 날개 3장 · 각도 15° (아래 → 위 흐름)</text>
    <text x="40" y="416"><tspan font-weight="800">5</tspan> 받침 · 흰 무광 · Ø150 × 40mm<tspan x="56" dy="16">통 자리 Ø94 · 깊이 6mm · 컵 · 히터 · 펠티어 · 팬 없음</tspan></text>
    <text x="40" y="516"><tspan font-weight="800">6</tspan> 바닥판 · 고무발 4 · 바람 구멍 없음</text>
    <text x="40" y="586"><tspan font-weight="800">7</tspan> 빛 링 · 받침 윗테 둘레 · 유백 PC 확산 · 단색(따뜻한 흰)</text>
    <text x="40" y="646"><tspan font-weight="800">16</tspan> 앞면 · 빛 막대 1줄(위) + 버튼 1(아래) · Hurom 각인</text>
  </g>
  <!-- leader labels right -->
  <g font-size="13" fill="#222">
    <g stroke="#999" stroke-width="1"><line x1="606" y1="300" x2="1080" y2="150"/><line x1="672" y1="477" x2="1080" y2="230"/><line x1="618" y1="494" x2="1080" y2="290"/><line x1="644" y1="520" x2="1080" y2="350"/><line x1="751" y1="460" x2="1080" y2="410"/><line x1="746" y1="449" x2="1080" y2="470"/><line x1="877" y1="511" x2="1080" y2="530"/><line x1="840" y1="575" x2="1080" y2="590"/></g>
    <text x="1160" y="146" text-anchor="end"><tspan font-weight="800">8</tspan> 투명 축 · 트라이탄 Ø8 · 뚜껑 가운데 베어링에서 따라 돎<tspan x="1160" dy="16">뚜껑 손잡이 = 축 머리 · 뚜껑을 들면 젓개가 같이 나옴</tspan></text>
    <text x="1160" y="226" text-anchor="end"><tspan font-weight="800">9</tspan> 구동 자석 디스크 Ø40 × 5mm + 철 백요크 1mm</text>
    <text x="1160" y="286" text-anchor="end"><tspan font-weight="800">10</tspan> 부시 베어링 · 자석 당김 약 8N을 받음</text>
    <text x="1160" y="346" text-anchor="end"><tspan font-weight="800">11</tspan> 5V 기어 모터 · 20~30rpm · 0.1 N·m · 평균 1~2W</text>
    <text x="1160" y="406" text-anchor="end"><tspan font-weight="800">12</tspan> 통 감지 · 홀 센서 (구동 자석과 25mm 이상)</text>
    <text x="1160" y="466" text-anchor="end"><tspan font-weight="800">13</tspan> 단색 LED 링 (숨쉬기 = 젓는 중 · 고정 = 다 녹음)</text>
    <text x="1160" y="526" text-anchor="end"><tspan font-weight="800">14</tspan> USB-C 꽂이 · CC 5.1kΩ 두 개로 5V 고정 · PD 없음</text>
    <text x="1160" y="586" text-anchor="end"><tspan font-weight="800">15</tspan> 제어 보드 · MCU + 모터 드라이버 + 전류 감지<tspan x="1160" dy="16">걸림 · 헛돎 · 다 녹음 판정 · 온도 제어 없음</tspan></text>
  </g>
  <text x="600" y="690" font-size="12" text-anchor="middle" fill="#777">빨강 치수 = 유효 간격 4.5mm(유리 2.5 + 덮개 1.0 + 띄움 0.5 + 틈 0.5) · 빨강·파랑 = 자석 N·S극(단면에 보이는 2개) · 설계 목표값 · 비교안 A · C는 통 모양만 다름 · 2L 이전 안은 아래 접힌 칸</text>
</svg>
